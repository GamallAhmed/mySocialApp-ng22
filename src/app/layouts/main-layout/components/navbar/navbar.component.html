<nav class="bg-white border-b border-gray-100 shadow-sm sticky top-0 z-50">
  <div class="max-w-[1200px] mx-auto px-4 h-16 flex items-center justify-between">
    
    <!-- 1. اللوجو -->
    <div class="flex items-center gap-3 cursor-pointer" routerLink="/timeline">
      <!-- اللوجو الجديد -->
      <div class="w-10 h-10 bg-mainColor rounded-xl flex items-center justify-center text-white shadow-md">
        <i class="fa-solid fa-bolt text-xl"></i>
      </div>
      <span class="text-xl font-extrabold text-gray-800 tracking-tight hidden sm:block">SocialApp</span>
    </div>

    <!-- 2. اللينكات (تظهر فقط في الشاشات الكبيرة) -->
    <div class="hidden md:flex items-center bg-gray-50/80 rounded-2xl p-1.5 border border-gray-100/50 backdrop-blur-sm">
      <a routerLink="/timeline" routerLinkActive="bg-white text-mainColor shadow-sm" 
         class="flex items-center gap-2 px-6 py-2 rounded-xl text-sm font-semibold text-gray-500 hover:text-mainColor transition-all duration-200">
        <i class="fa-solid fa-house"></i>
        <span>Feed</span>
      </a>
      
      <a routerLink="/profile" routerLinkActive="bg-white text-mainColor shadow-sm"
         class="flex items-center gap-2 px-6 py-2 rounded-xl text-sm font-semibold text-gray-500 hover:text-mainColor transition-all duration-200">
        <i class="fa-regular fa-user"></i>
        <span>Profile</span>
      </a>
      
      <a routerLink="/notifications" routerLinkActive="bg-white text-mainColor shadow-sm"
         class="flex items-center gap-2 px-6 py-2 rounded-xl text-sm font-semibold text-gray-500 hover:text-mainColor transition-all duration-200">
        <i class="fa-regular fa-comment-dots"></i>
        <span>Notifications</span>
      </a>
    </div>

    <div class="relative">
      
      <div (click)="isDropdownOpen.set(!isDropdownOpen())" 
           class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 p-1.5 pr-3 rounded-full border border-gray-100 hover:border-gray-200 transition-all duration-200 shadow-sm">
        <!-- الصورة -->
        <img src="https://i.pravatar.cc/150?img=11" alt="User" class="w-9 h-9 rounded-full object-cover ring-2 ring-mainColor/20">
        <div class="hidden sm:flex flex-col items-start">
          <span class="text-sm font-bold text-gray-800 leading-tight">Ahmed Menisy</span>
          <span class="text-[11px] text-gray-500 leading-tight">&#64;ahmed</span>
        </div>
        <i class="fa-solid fa-chevron-down text-xs text-gray-400 ml-1 transition-transform duration-200" 
           [class.rotate-180]="isDropdownOpen()"></i>
      </div>

  
      @if (isDropdownOpen()) {
        <div class="absolute right-0 top-full mt-2 w-60 bg-white rounded-2xl shadow-xl border border-gray-100 py-2 z-[100] overflow-hidden">
          
          <div class="flex flex-col md:hidden border-b border-gray-100 pb-2 mb-2">
            <a routerLink="/timeline" (click)="isDropdownOpen.set(false)" 
               class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 hover:text-mainColor transition-colors">
              <i class="fa-solid fa-house text-gray-400 w-5 text-center"></i> Feed
            </a>
            <a routerLink="/profile" (click)="isDropdownOpen.set(false)" 
               class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 hover:text-mainColor transition-colors">
              <i class="fa-regular fa-user text-gray-400 w-5 text-center"></i> Profile
            </a>
            <a routerLink="/notifications" (click)="isDropdownOpen.set(false)" 
               class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 hover:text-mainColor transition-colors">
              <i class="fa-regular fa-comment-dots text-gray-400 w-5 text-center"></i> Notifications
            </a>
          </div>

          <!-- الإعدادات وتسجيل الخروج -->
          <a routerLink="/settings" (click)="isDropdownOpen.set(false)" 
             class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 hover:text-mainColor transition-colors">
            <i class="fa-solid fa-gear text-gray-400 w-5 text-center"></i> Settings
          </a>
          
          <div class="border-t border-gray-100 mt-1 pt-1"></div>

          <button (click)="logout()" 
                  class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-bold text-red-600 hover:bg-red-50 transition-colors text-left">
            <i class="fa-solid fa-arrow-right-from-bracket w-5 text-center"></i> Logout
          </button>
        </div>
      }
      
    </div>

  </div>
</nav>
